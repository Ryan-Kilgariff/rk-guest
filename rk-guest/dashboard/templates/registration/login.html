<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Sign in | RK Guest</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #f2f4f3;
            color: #202521;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 36px;
            border-radius: 22px;
            background: #ffffff;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }
        .brand {
            margin-bottom: 32px;
            text-align: center;
        }
        .brand-mark {
            width: 58px;
            height: 58px;
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: #1f2b24;
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
        }
        h1 {
            margin: 0;
            font-size: 28px;
        }
        .subtitle {
            margin: 8px 0 0;
            color: #727873;
        }
        form p {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d9dedb;
            border-radius: 10px;
            font-size: 16px;
        }
        input:focus {
            outline: 2px solid #b7c2bb;
            border-color: #78847c;
        }
        button {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            border: 0;
            border-radius: 11px;
            background: #1f2b24;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        .error {
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 10px;
            background: #fff0f0;
            color: #9e2929;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="brand">
        <div class="brand-mark">
            RK
        </div>
        <h1>RK Guest</h1>
        <p class="subtitle">
            Property management portal
        </p>
    </div>
    {% if form.errors %}
        <div class="error">
            Your username or password was incorrect.
        </div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">
            Sign in
        </button>
    </form>
</div>
</body>
</html>
